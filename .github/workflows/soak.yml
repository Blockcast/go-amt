name: RSS soak

# Process-level counterpart to shred/retention_test.go.
#
# TestScorerRetentionPlateaus and TestScorerHeldMemoryPlateaus bound the DATA
# STRUCTURE: held entries, and held HeapAlloc, stop growing once the stream is
# longer than the window. Neither says anything about the long-running process,
# and the bug they came from (BLO-28422) was a process OOM. A non-scorer
# allocation with the same shape — per-shred or per-set state held for process
# life — would reproduce that OOM and be invisible to both.
#
# So this drives the real binary over its real UDP socket and watches RSS.
#
# workflow_dispatch rather than a push trigger: the run is ~10 minutes of
# wall clock at the default inputs, which is an order of magnitude more than the
# whole CI workflow, and the property it guards changes only when the retention
# bound does. Run it when touching shred/retention.go, shred/score.go or the
# receiver's ingress path.
on:
  workflow_dispatch:
    inputs:
      rate:
        description: Target unique shreds per second
        default: "2500"
      count:
        # The plateau is checked at N and 3N with N >= 500,000, so the run needs
        # 1,500,000 shreds ACCEPTED, not sent. Some are always lost: sender and
        # receiver share a loopback here, and a measured 2.2% went missing at
        # 12,500/s locally. The 10% headroom keeps a normal loss rate from
        # failing the run on N < 500,000 having proved the plateau anyway.
        description: Total unique shreds to emit (3N; the plateau is checked at N and 3N)
        default: "1650000"
      retain:
        description: --retain window passed to the receiver
        default: "2s"
      sample_interval:
        description: Seconds between RSS samples
        default: "5"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    # 10 minutes of soak plus build and checkout. Generous, but a hang here
    # should fail rather than burn the default 6h.
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      LISTEN: 127.0.0.1:20000
      HTTP: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The driver's own guards. If the generator stopped producing unique
      # identities — the false-negative this whole job exists to avoid — the soak
      # below would report a flat RSS and prove nothing, so the property is
      # asserted before the run rather than inferred from its result.
      - name: Test the soak driver
        run: go test -count=1 ./cmd/shred-soak/

      - name: Build
        run: |
          set -euo pipefail
          go build -o bcast-shred-gw ./cmd/blockcast-shreds
          go build -o shred-soak ./cmd/shred-soak
          ls -l bcast-shred-gw shred-soak

      - name: Soak
        run: |
          set -euo pipefail
          ./bcast-shred-gw --listen "$LISTEN" --http-addr "$HTTP" \
            --retain '${{ inputs.retain }}' --json > receipt.json 2> receiver.err &
          gw=$!
          # Fail loudly if the receiver died at startup rather than sampling a
          # dead pid for ten minutes and reporting an empty series.
          sleep 2
          kill -0 "$gw" 2>/dev/null || { echo "::error::receiver exited at startup"; cat receiver.err; exit 1; }

          # Sample RSS against the CUMULATIVE UNIQUE SHRED COUNT THE PROCESS
          # ITSELF REPORTS, not against elapsed time and not against the driver's
          # sent count. ingress_packets_total counts what arrived; every datagram
          # the driver sends carries an identity it has never sent before, and
          # shreds_unparsed_total is asserted zero below, so accepted ingress is
          # exactly cumulative unique shreds. Pairing RSS with elapsed time
          # instead would misattribute a UDP loss burst as memory growth.
          echo "elapsed_s,unique_shreds,rss_kb" > rss.csv
          (
            start=$SECONDS
            while kill -0 "$gw" 2>/dev/null; do
              rss=$(awk '/^VmRSS:/{print $2}' /proc/$gw/status 2>/dev/null || echo "")
              # printf "%d", not print: Prometheus renders a counter past ~1e6 in
              # scientific notation (1.467369e+06), and taking $2 verbatim then
              # truncating at the decimal point yields "1" for the whole run. That
              # is not a loud failure -- the series looks well-formed and the
              # plateau check reports "the run was too short" -- so it is fixed
              # here rather than tolerated downstream. awk's %d does the conversion.
              shreds=$(curl -s --max-time 2 "http://$HTTP/metrics" \
                | awk '/^bcast_shred_gw_ingress_packets_total/{printf "%d\n", $2; exit}')
              if [ -n "$rss" ] && [ -n "$shreds" ]; then
                echo "$((SECONDS-start)),$shreds,$rss" >> rss.csv
              fi
              sleep '${{ inputs.sample_interval }}'
            done
          ) &
          sampler=$!

          ./shred-soak --to "$LISTEN" --rate '${{ inputs.rate }}' --count '${{ inputs.count }}' \
            --progress 30s | tee driver.log

          # Let the last packets land and one more sample fall before shutdown.
          sleep "$(( ${{ inputs.sample_interval }} + 3 ))"
          curl -s "http://$HTTP/metrics" | grep -E '^bcast_shred_gw_' > metrics.txt
          kill -INT "$gw"; wait "$gw" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true
          echo "--- receipt"; cat receipt.json
          echo "--- rss series"; cat rss.csv

      - name: Assert the plateau
        run: python3 scripts/assert_rss_plateau.py rss.csv metrics.txt receipt.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-soak
          path: |
            rss.csv
            metrics.txt
            receipt.json
            driver.log
            receiver.err
