name: static binary
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o blockcast-shreds ./cmd/blockcast-shreds
      - run: test -s blockcast-shreds
