name: CI

# WHY THIS RUNS ON EVERY BRANCH PUSH, NOT JUST main (BLO-29064 follow-up)
#
# `pull_request` builds and tests refs/pull/N/merge. That ref only exists while
# GitHub can merge the head into the base — so the moment an unrelated commit
# lands on main and puts a PR into CONFLICTING, GitHub stops producing the merge
# ref and **queues nothing**. No run appears, no check turns red, and the last
# green run stays as the PR's latest status.
#
# That silence is not visible from the usual tools. `gh pr checks` reported this
# repo's PR #47 as fully passing at 383730f while `test`, `race` and `cgo-test`
# had executed against that head ZERO times: the four green checks it was
# reading came from static-binary.yml and packaging.yml, which are
# `on: [push, pull_request]` and so kept firing on the branch tip. The window
# opened when an unrelated PR merged 28 minutes earlier — neither side touched a
# shared file, and nobody did anything wrong. With no branch protection on main
# here, a PR in that state is one click from merging untested.
#
# The branch tip always exists, whether or not the PR is mergeable, so a plain
# `push` trigger cannot be silenced this way. Both triggers are kept
# deliberately: `push` guarantees the head is tested, and `pull_request` keeps
# testing the MERGE RESULT, which is the only thing that catches a latent
# conflict with main that still compiles — exactly how the BLO-28422
# sentinel-flag hang surfaced.
#
# Measured before this change, over the last 100 CI runs: 78 pull_request runs
# across 26 branches, 22 push runs across exactly ONE branch (main), and zero
# push runs on any feature branch.
#
# Cost of the overlap is negligible here — all four jobs are ubuntu-latest and
# the whole workflow finishes in about a minute.
on:
  pull_request:
  push:
    # '**' matches every branch and, unlike a bare `push:`, excludes tags.
    branches: ['**']

# Supersede in-flight runs when a branch is pushed again — but never on main,
# where a cancelled run is indistinguishable from one that passed and would
# leave a commit on the default branch with no completed CI at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Build-selection coverage map. conn.go, gateway.go and protocol_cgo.go are
# tagged `cgo && !purego`, so which job compiles them is not obvious:
#
#   job              | CGO_ENABLED | tags   | conn/gateway/protocol_cgo | race
#   -----------------|-------------|--------|---------------------------|-----
#   test             | 0           | -      | NO (conn_nocgo.go instead)| no
#   race             | 1           | purego | NO (conn_nocgo.go instead)| yes
#   cgo-test         | 1           | -      | YES                       | named tests only
#   mobile-typecheck | 0           | -      | NO (conn_mobile.go instead)| no
#
# mobile-typecheck is the fourth selection, not a variant of the first three:
# GOOS=android picks conn_mobile.go, which none of the ubuntu-only jobs above
# compiles at all. That is how it came to be missing a field the other variants
# carry (BLO-28640). It supersedes an earlier cgo-typecheck job, whose whole
# purpose — type-checking the cgo selection nothing else compiled — is now done
# for real by cgo-test, which links libamt_protocol and runs those tests.
#
# Only conn.go has a tagged counterpart: conn_nocgo.go is `(!cgo || purego)`,
# a genuine either/or with conn.go. protocol_pure.go is UNTAGGED and compiles
# in all three jobs — it is not a purego-only stand-in, and removing the purego
# tag would not remove it. It declares PureGoProtocol while protocol_cgo.go
# declares CGOProtocol, so the two coexist under cgo rather than replacing one
# another, and the implementation is chosen at runtime by init() registration,
# not by build tags. Confirm with:
#   CGO_ENABLED=1 go list -f '{{.GoFiles}} {{.CgoFiles}}' .
# which lists protocol_pure.go and protocol_cgo.go together.
#
# Only cgo-test builds and exercises the native selection. Keep this table
# honest when adding a job — BLO-28640 (a probe window that made native
# multicast structurally unreachable) reached production while `test` and
# `race` between them compiled that code path zero times.
#
# The native-delivery harness (BLO-29196) is tag-split along the same seam, and
# which lane asserts which arbiter follows from the table above rather than from
# anything about the tests:
#
#   file                          | tags              | asserts        | lanes
#   ------------------------------|-------------------|----------------|--------------------
#   fakenative_test.go            | linux \|\| darwin | (the fake)     | test, race, cgo-test
#   fakenative_flows_test.go      | linux \|\| darwin | ManagedConn    | test, race, cgo-test
#   fakerelay_switchover_test.go  | cgo && !purego    | MulticastConn  | cgo-test ONLY
#
# MulticastConn reaches AMT through Gateway, and both conn.go and gateway.go are
# `cgo && !purego`, so the live-path arbiter can only be asserted in cgo-test.
# ManagedConn reaches it through the untagged relay_manager.go, so its arbiter is
# asserted everywhere. Each lane below asserts its own selection with `go list`,
# because `go test` exits 0 whether a file was selected or not.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Covers the pure-Go selection: conn_nocgo.go stands in for conn.go, which
      # CGO_ENABLED=0 deselects. protocol_cgo.go is deselected too, leaving
      # protocol_pure.go as the only registered AMTProtocol implementation —
      # note that protocol_pure.go is untagged and is compiled here and in the
      # cgo job alike; what changes between jobs is which implementations are
      # available to register, not whether this file is built.
      - run: go test ./...
      - run: go vet ./...

      # The native-delivery harness (BLO-29196) is split across two tag sets on
      # purpose. fakenative_test.go and fakenative_flows_test.go are
      # `linux || darwin`, so they cover ManagedConn's native-vs-tunnel arbiter in
      # THIS lane; fakerelay_switchover_test.go is `cgo && !purego` and covers
      # MulticastConn's in cgo-test, because conn.go and gateway.go are not built
      # here. Assert the split rather than trusting it: `go test` exits 0 whether
      # a file was selected or not, so a tag mistake would silently relocate
      # coverage between lanes — the same class of gap as BLO-28640.
      - name: Assert the native-delivery harness is selected in this lane
        run: |
          set -euo pipefail
          tst=$(go list -f '{{join .TestGoFiles "\n"}}{{"\n"}}{{join .XTestGoFiles "\n"}}' .)
          echo "selected test files: $(printf '%s\n' "$tst" | tr '\n' ' ')"
          rc=0
          for t in fakenative_test.go fakenative_flows_test.go; do
            printf '%s\n' "$tst" | grep -qxF "$t" || {
              echo "::error::$t is not in the CGO_ENABLED=0 test selection; the ManagedConn switchover tests are not running in this lane"
              rc=1
            }
          done
          # The cgo-only half must NOT be here. If it were, it would run against
          # conn_nocgo.go's stub, whose Open returns errNoCGO unconditionally —
          # so it could only pass by asserting nothing.
          if printf '%s\n' "$tst" | grep -qxF fakerelay_switchover_test.go; then
            echo "::error::fakerelay_switchover_test.go is selected under CGO_ENABLED=0; it needs the real MulticastConn, not the stub"
            rc=1
          fi
          exit $rc

      # By name, so the log carries positive proof these executed. A bare "ok" is
      # also what a fully deselected package prints. Same rationale and the same
      # rc-capture shape as the Gateway.Open guards in cgo-test below.
      - name: Prove the native-delivery harness guards ran
        run: |
          set -euo pipefail
          names='TestFakeNativeSourceDeliversOnlyWhileEnabled
          TestFakeNativeSourceIsolatesGroups
          TestProvenanceOfNamesEachDeliveryPath
          TestReadOneTimeoutDoesNotStealTheNextDatagram
          TestConnTypesDoNotClaimInPlaceReadBounds
          TestManagedConnKeepsNativeWhenBothPathsAreLive
          TestManagedConnSwitchesFromNativeToRelayAndBack
          TestNativeDeliveryAssertionFailsWhenNativeNeverDelivers'
          rc=0
          go test -v -count=1 -run "$(echo $names | tr ' ' '|')" . 2>&1 | tee /tmp/native-harness.log || rc=$?
          for t in $names; do
            grep -qF -- "--- PASS: $t" /tmp/native-harness.log || {
              echo "::error::$t did not report a PASS line; it was skipped, deselected or failed"
              rc=1
            }
          done
          exit $rc

  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The race detector needs cgo, but the default cgo build links against
      # the native libamt_protocol, which is not available on a stock runner.
      # The purego tag selects the pure-Go protocol/conn implementations so the
      # race detector can run without that dependency. It does not alter the
      # default (cgo) or CGO_ENABLED=0 build selections.
      #
      # Coverage caveat: because purego deselects them, gateway.go, conn.go and
      # protocol_cgo.go get NO race coverage here. relay_manager.go and the rest
      # of the package are untagged and are covered. e2e_test.go is selected,
      # but skips unless AMT_E2E_RELAY is set, so it contributes no coverage
      # here either.
      #
      # This is a NARROWED race-coverage gap. It used to be a total build-coverage
      # gap — nothing on CI compiled those three files — which is how BLO-28640
      # shipped. The cgo-test job below builds and tests them, and now runs the
      # named Gateway.Open tests under -race (BLO-29064), so those specific tests
      # ARE race-covered. The rest of the package there still is not: anything
      # those tests do not reach — handleMembershipQuery, for one — has no race
      # coverage on any job.
      - run: go test -race -tags purego ./...

      # The same two guards the `test` lane carries, because this lane needs them
      # MORE, not less (BLO-29196 review). `race` is the only lane that can catch
      # a data race between installFakeNativeSource's t.Cleanup restore of the
      # package-global listenMulticastUDP4 seam and a background goroutine in the
      # code under test still reaching it — and the only one exercising the
      # switchover against protocol_pure.go rather than the Rust path. A future
      # tag edit that dropped the harness out of this lane would take both with
      # it and print nothing: `go test` exits 0 whether a file was selected or
      # not. That is the BLO-28640 shape, in the lane this harness needs most.
      - name: Assert the native-delivery harness is selected in this lane
        run: |
          set -euo pipefail
          tst=$(go list -tags purego -f '{{join .TestGoFiles "\n"}}{{"\n"}}{{join .XTestGoFiles "\n"}}' .)
          echo "selected test files: $(printf '%s\n' "$tst" | tr '\n' ' ')"
          rc=0
          for t in fakenative_test.go fakenative_flows_test.go; do
            printf '%s\n' "$tst" | grep -qxF "$t" || {
              echo "::error::$t is not in the -tags purego test selection; the ManagedConn switchover tests are not race-covered"
              rc=1
            }
          done
          # purego deselects conn.go/gateway.go, so the cgo-only half must not be
          # here either: it would run against conn_nocgo.go's stub, whose Open
          # returns errNoCGO unconditionally, and could only pass by asserting
          # nothing.
          if printf '%s\n' "$tst" | grep -qxF fakerelay_switchover_test.go; then
            echo "::error::fakerelay_switchover_test.go is selected under -tags purego; it needs the real MulticastConn, not the stub"
            rc=1
          fi
          exit $rc

      # By name and under -race, so the log carries positive proof these executed
      # here rather than a bare "ok" that a fully deselected package also prints.
      - name: Prove the native-delivery harness guards ran under -race
        run: |
          set -euo pipefail
          names='TestFakeNativeSourceDeliversOnlyWhileEnabled
          TestFakeNativeSourceIsolatesGroups
          TestProvenanceOfNamesEachDeliveryPath
          TestReadOneTimeoutDoesNotStealTheNextDatagram
          TestConnTypesDoNotClaimInPlaceReadBounds
          TestManagedConnKeepsNativeWhenBothPathsAreLive
          TestManagedConnSwitchesFromNativeToRelayAndBack
          TestNativeDeliveryAssertionFailsWhenNativeNeverDelivers'
          rc=0
          go test -race -tags purego -v -count=1 -run "$(echo $names | tr ' ' '|')" . 2>&1 | tee /tmp/native-harness-race.log || rc=$?
          for t in $names; do
            grep -qF -- "--- PASS: $t" /tmp/native-harness-race.log || {
              echo "::error::$t did not report a PASS line under -race; it was skipped, deselected or failed"
              rc=1
            }
          done
          exit $rc

  # Build libamt_protocol and run the cgo-tagged tests for real.
  #
  # `test` (CGO_ENABLED=0) and `race` (-tags purego) both deselect conn.go,
  # gateway.go and protocol_cgo.go, so the native multicast join, the AMT tunnel
  # handover and the relay handshake used to be compiled by no job at all, and
  # gateway_timeout_test.go — the regression guard for the unbounded
  # Gateway.Open fixed in #29 — had never executed. See BLO-28739.
  #
  # Linking needs the native library, so this job builds it from the
  # amt-protocol submodule via that repo's own `make ffi` target
  # (cargo build --release --features ffi --no-default-features) and points the
  # linker and loader at target/release. The C header comes from the go-amt
  # tree via `#cgo CFLAGS: -I${SRCDIR}`, not from the submodule, so no header
  # generation step is needed.
  cgo-test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      CGO_LDFLAGS: -L${{ github.workspace }}/amt-protocol/target/release
      LD_LIBRARY_PATH: ${{ github.workspace }}/amt-protocol/target/release
    steps:
      - uses: actions/checkout@v4
        with:
          # amt-protocol carries the FFI crate. Without it there is no library
          # to link, and this job must fail rather than silently skip.
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build libamt_protocol
        working-directory: amt-protocol
        run: |
          set -euo pipefail
          # Rust is preinstalled on GitHub-hosted ubuntu runners. Assert it
          # rather than letting `make ffi` fail with a bare "cargo: not found".
          command -v cargo >/dev/null || {
            echo "::error::cargo not found; this job needs a Rust toolchain to build libamt_protocol"
            exit 1
          }
          cargo --version
          make ffi

      - name: Assert the native library was produced
        run: |
          set -euo pipefail
          lib=amt-protocol/target/release/libamt_protocol.so
          test -f "$lib" || { echo "::error::$lib missing after 'make ffi'"; exit 1; }
          ls -l "$lib"

      # A green tick must not be reachable while the cgo files are deselected.
      # This is a structural check on purpose: `go test -run TestGatewayOpen...`
      # under CGO_ENABLED=0 prints "testing: warning: no tests to run" and still
      # exits 0, so a -run filter alone cannot tell "passed" from "never built".
      #
      # Check .GoFiles *and* .CgoFiles: go list puts any file that imports "C"
      # in .CgoFiles, so gateway.go and protocol_cgo.go never appear in .GoFiles
      # even when correctly selected, while conn.go (no import "C") only ever
      # appears in .GoFiles. Testing either list alone gives a false answer.
      - name: Assert the cgo selection is live
        run: |
          set -euo pipefail
          sel=$(go list -f '{{join .GoFiles "\n"}}{{"\n"}}{{join .CgoFiles "\n"}}' .)
          tst=$(go list -f '{{join .TestGoFiles "\n"}}{{"\n"}}{{join .XTestGoFiles "\n"}}' .)
          echo "selected sources: $(printf '%s\n' "$sel" | tr '\n' ' ')"
          rc=0
          for f in conn.go gateway.go protocol_cgo.go; do
            printf '%s\n' "$sel" | grep -qxF "$f" || {
              echo "::error::$f is not in the build selection; the cgo tests would pass vacuously"
              rc=1
            }
          done
          for t in gateway_timeout_test.go gateway_logging_test.go gateway_advertisement_length_test.go; do
            printf '%s\n' "$tst" | grep -qxF "$t" || {
              echo "::error::$t is not in the test selection; the Gateway.Open guards are not running"
              rc=1
            }
          done
          # Both halves of the native-delivery harness must be here: the cgo-only
          # MulticastConn switchover, and the shared fake it is built on. This is
          # the ONLY lane that compiles conn.go and gateway.go, so it is the only
          # lane where the live-path arbiter is asserted at all — if
          # fakerelay_switchover_test.go is deselected here it is deselected
          # everywhere, which is exactly how BLO-28640 shipped.
          for t in fakenative_test.go fakenative_flows_test.go fakerelay_switchover_test.go; do
            printf '%s\n' "$tst" | grep -qxF "$t" || {
              echo "::error::$t is not in the cgo test selection; the MulticastConn switchover tests are not running anywhere"
              rc=1
            }
          done
          exit $rc

      # Full `go vet` over the cgo selection, which no other job covers.
      #
      # `go test` below runs only vet's test-relevant subset (printf, atomic,
      # errorsas, ifaceassert, bool, stringintconv, buildtags, nilfunc, tests).
      # The analyzer that matters most here is not in it: cgocall — the one that
      # flags passing Go pointers into C — can ONLY ever fire on the
      # `cgo && !purego` selection, and copylocks, lostcancel and unusedresult
      # are likewise dropped over conn.go and gateway.go, which the other two
      # jobs do not compile at all.
      #
      # loopclosure is deliberately NOT in that list even though it looks like it
      # belongs: it only reports when the module's language version is below
      # go1.22, and go.mod declares go 1.24.0, so it cannot fire here at all.
      # Naming it would be the same overstated-coverage error this step exists to
      # correct, in the one file whose header says to keep the table honest.
      #
      # This is a step rather than a job on purpose: the env here already carries
      # CGO_LDFLAGS/LD_LIBRARY_PATH and the library is already built, so it costs
      # no second submodule checkout and no second Rust build.
      #
      # Ordering: after the selection assertion above, so a vacuous pass trips
      # that gate before vet can report clean over nothing; and before the
      # BLO-28805 block below, so that block stays adjacent to the `Test` step it
      # documents rather than reading as this step's preamble.
      - name: Vet the cgo selection
        run: go vet ./...

      # Known-failing on the cgo path only, tracked in BLO-28805. Two distinct
      # confidence levels here — do not collapse them into one claim.
      #
      # CONFIRMED implementation divergence (2 tests):
      #   TestUnsubscribeDuringPendingJoinPreservesOtherSource
      #   TestV4MappedSubscriptionCompletesFullLifecycle
      # amt-protocol/src/gateway.rs:252 guards send_update with a single-state
      # check, `if self.state != GatewayState::Querying`, and :259 then assigns
      # GatewayState::Active — so the Querying state is consumed and
      # CreateMembershipUpdate is single-shot per Membership Query. Every later
      # leave/unsubscribe re-enters at :252 with state Active, fails the guard,
      # and returns InvalidState (= 2, ffi.rs:40). The failure text naming state
      # `Active` is what confirms this: Active is rejected by that guard, not
      # accepted, so the nonce lookup at :256 is never reached. The pure-Go
      # implementation permits the call from Active, which is why the same
      # untagged tests pass in `test`.
      #
      # UNVERIFIED, grouped here only because they fail on this path (2 tests):
      #   TestQueuedPacketsOwnPayloadAndSourceAddress   — fails on "never became
      #     active (state Suspended)", not on error code 2. This is the buffer
      #     aliasing / gopacket.NoCopy guard, so skipping it drops shared-read-
      #     buffer coverage exactly where that buffer crosses the FFI boundary.
      #   TestDataStarvationReconnectsDespiteControlTraffic — fails on its own
      #     premise guard ("relay sent no Membership Query ... 1 -> 1") with no
      #     InvalidState in the message. fakerelay_flows_test.go:536-541
      #     documents that exact failure as a possible loaded-runner timing
      #     artifact, so it may be a flake rather than a divergence.
      # If either proves to be a flake it has nothing to fix under BLO-28805 and
      # must not stay skipped under a ticket that can never retire it. Both are
      # untagged, so a genuine flake will also surface in `test` and `race`
      # while being masked in this job alone — treat a red there as signal.
      #
      # This list is narrow and named on purpose. It does not weaken the gate:
      # the selection assertion above still fails if the cgo files are not
      # compiled, and the Gateway.Open guards below still run. Delete the -skip
      # when BLO-28805 lands; its acceptance criteria require exactly that.
      - name: Test
        run: |
          go test -skip 'TestQueuedPacketsOwnPayloadAndSourceAddress|TestUnsubscribeDuringPendingJoinPreservesOtherSource|TestV4MappedSubscriptionCompletesFullLifecycle|TestDataStarvationReconnectsDespiteControlTraffic' ./...

      # Run the Gateway.Open guards by name so the log carries positive proof
      # they executed, rather than a bare "ok" that is also what a fully
      # deselected package prints.
      #
      # Under -race, deliberately. gateway.go had ZERO race coverage on CI: the
      # only -race job runs -tags purego, which deselects this file, and this job
      # compiled it without the detector. That gap is documented in the coverage
      # table at the top of this file, and it was not hypothetical — it hid an
      # unsynchronised Gateway.leave, written by stopKeepalive and read by the
      # keepalive goroutine, which reproduced 3/3 locally while CI stayed green
      # (BLO-29064). Running the whole package under -race here would roughly
      # double the job; these named tests are the ones that actually exercise
      # gateway.go's concurrency, so the detector is pointed at them.
      - name: Prove the Gateway.Open guards ran (under -race)
        run: |
          set -euo pipefail
          # Capture the status rather than letting `set -e` abort here. With a
          # bare pipeline a non-zero `go test` would exit the step before the
          # loop below, so the "did not report a PASS line" diagnostic would be
          # reachable only for a skip (exit 0) and never for a failure. We want
          # the loop to run either way, then fail on the captured status.
          rc=0
          go test -v -count=1 -race \
            -run 'TestGatewayOpenTimesOutAgainstSilentRelay|TestGatewayOpenZeroTimeoutUsesDefault|TestGatewayOpenLogsTheRelayItIsAttempting|TestGatewayOpenLogsWithoutARelayAddress|TestStopKeepaliveIsObservedByTheKeepaliveGoroutine' \
            . 2>&1 | tee /tmp/cgo-test.log || rc=$?
          for t in TestGatewayOpenTimesOutAgainstSilentRelay TestGatewayOpenZeroTimeoutUsesDefault \
                   TestGatewayOpenLogsTheRelayItIsAttempting TestGatewayOpenLogsWithoutARelayAddress \
                   TestStopKeepaliveIsObservedByTheKeepaliveGoroutine; do
            grep -qF -- "--- PASS: $t" /tmp/cgo-test.log || {
              echo "::error::$t did not report a PASS line; it was skipped, deselected or failed"
              rc=1
            }
          done
          exit $rc

      # The MulticastConn switchover guards. This lane is the only one that can
      # run them, so a silent deselection here leaves the live-path arbiter
      # asserted by nothing at all — which is the gap BLO-29196 exists to close.
      #
      # The log assertions below are NOT redundant with the PASS lines. Until
      # BLO-29437 the handover test had a timeout branch that returned early and
      # passed, so `--- PASS` was exactly what an unfixed, never-completing
      # handshake produced. The completion of the handshake is therefore asserted
      # on its own log line, and the old incomplete-handshake line must be absent.
      - name: Prove the MulticastConn switchover guards ran
        run: |
          set -euo pipefail
          names='TestMulticastConnKeepsNativeWhenBothPathsAreLive
          TestMulticastConnHandsOverToTheRelayWhenNativeIsSilent
          TestMulticastConnPicksNativeAgainAfterItRecovers
          TestRelayAdvertisementMustBeDecodedAtItsReceivedLength'
          rc=0
          go test -v -count=1 -run "$(echo $names | tr ' ' '|')" . 2>&1 | tee /tmp/switchover.log || rc=$?
          for t in $names; do
            grep -qF -- "--- PASS: $t" /tmp/switchover.log || {
              echo "::error::$t did not report a PASS line; it was skipped, deselected or failed"
              rc=1
            }
          done
          # Positive: the AMT handshake actually completed against fakeRelay, so
          # the tunnel-data assertions that follow it in the test were reached.
          grep -qF -- 'Gateway.Open COMPLETED against fakeRelay' /tmp/switchover.log || {
            echo "::error::the handover test never logged a completed Gateway.Open; the tunnel-DATA leg did not run (BLO-29437 regression)"
            rc=1
          }
          # Negative: the phrase the test uses when the handshake breaks after the
          # relay answered. Its presence means the handshake regressed even if
          # something downstream still managed to pass.
          if grep -qF -- 'Gateway.Open did not complete against fakeRelay' /tmp/switchover.log; then
            echo "::error::the handover test reported an incomplete handshake (BLO-29437 regression)"
            rc=1
          fi
          exit $rc

      # The shared half, in this lane too.
      #
      # The first three touch no protocol implementation at all — they drive the
      # fake native source through the join seam and assert its switch and its
      # provenance decoder — so they must pass identically in every lane, and a
      # failure means the harness itself is broken rather than the arbiter.
      #
      # The ManagedConn switchover tests are gated here as well, which was NOT
      # obviously safe: ManagedConn tunnels through RelayManager, and under cgo
      # RelayManager dispatches to the Rust amt_protocol implementation — the same
      # path whose divergences are catalogued in the BLO-28805 block above, one of
      # which is a subscription that never leaves Suspended. Run 32420713736
      # (2026-08-20) settled it: the subscription reaches Active and the 16-packet
      # tunnel burst is delivered on the Rust path, so BLO-28805 is confined to
      # leave/unsubscribe rather than join-and-deliver. They are named here now
      # that the lane has answered; before that, asserting them would have been
      # predicting rather than testing.
      - name: Prove the native-delivery harness guards ran under cgo
        run: |
          set -euo pipefail
          names='TestFakeNativeSourceDeliversOnlyWhileEnabled
          TestFakeNativeSourceIsolatesGroups
          TestProvenanceOfNamesEachDeliveryPath
          TestReadOneTimeoutDoesNotStealTheNextDatagram
          TestConnTypesDoNotClaimInPlaceReadBounds
          TestManagedConnKeepsNativeWhenBothPathsAreLive
          TestManagedConnSwitchesFromNativeToRelayAndBack
          TestNativeDeliveryAssertionFailsWhenNativeNeverDelivers'
          rc=0
          go test -v -count=1 -run "$(echo $names | tr ' ' '|')" . 2>&1 | tee /tmp/native-harness-cgo.log || rc=$?
          for t in $names; do
            grep -qF -- "--- PASS: $t" /tmp/native-harness-cgo.log || {
              echo "::error::$t did not report a PASS line under cgo; it was skipped, deselected or failed"
              rc=1
            }
          done
          exit $rc

  # MulticastConn is defined three times under mutually exclusive build tags
  # (conn.go for cgo, conn_nocgo.go, conn_mobile.go for android/ios). Nothing in
  # the ubuntu-only jobs above compiles the mobile variant, which is how it came
  # to be missing the Mode field that conn_nocgo.go documents as settable "under
  # any build configuration" (BLO-28640, Ally review on go-amt#49).
  #
  # `go vet` rather than `go build`: a struct missing a field builds perfectly
  # well on its own, so only the assignment in
  # managed_conn_plan_test.go:modeIsSettableUnderEveryBuildConfiguration catches
  # the drift, and vet is what type-checks test files.
  #
  # android only, deliberately. conn_mobile.go is tagged `android || ios`, so
  # vetting android type-checks the same file ios would; and GOOS=ios cannot be
  # vetted on ubuntu at all — the toolchain refuses with "ios/arm64 requires
  # external (cgo) linking" under CGO_ENABLED=0 and wants clang under =1. That is
  # a pre-existing toolchain limit, not something this job introduced.
  mobile-typecheck:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: GOOS=android GOARCH=arm64 go vet ./...
