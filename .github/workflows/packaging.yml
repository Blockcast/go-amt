name: packaging

# The Dockerfile, goreleaser config and install smoke test cannot be validated
# by `go test`, so without this workflow they rot silently until a release fails.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  # The load-bearing job: builds the static binary exactly as shipped and runs
  # the same smoke test an operator runs after installing it.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the shipped static binary
        # The -X path is fully qualified because the Go linker discards an -X for
        # an unknown symbol silently: -X main.version would build clean and
        # report dev-unstamped forever. github.ref_name stands in for the
        # release tag so this lane exercises the same stamped shape a release
        # takes, rather than leaving the stamp untested until tag day.
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X github.com/blockcast/go-amt/broker.version=${GITHUB_REF_NAME}" \
            -o blockcast-shreds ./cmd/blockcast-shreds
      - name: Assert the version stamp resolved
        # Guards the silent-discard failure directly: if the symbol path above
        # ever drifts, the binary still builds and this is the only thing that
        # notices.
        run: |
          reported="$(./blockcast-shreds --version)"
          echo "reported version: ${reported}"
          if [ "${reported}" = "dev-unstamped" ]; then
            echo "::error::-X stamp was silently discarded: the binary still reports dev-unstamped." \
                 "Check the symbol path github.com/blockcast/go-amt/broker.version in this workflow," \
                 ".goreleaser.yaml and the Dockerfile."
            exit 1
          fi
      - name: Install smoke test
        run: packaging/smoke-test.sh ./blockcast-shreds

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: blockcast-shreds:ci
          # Without this the image reports dev-unstamped forever, which is the
          # right default for a hand build and useless for one a cluster pulls:
          # the sha is what lets an operator tie a running pod to a commit.
          build-args: VERSION=sha-${{ github.sha }}
      # An image that builds but cannot execute its entrypoint is not a
      # verified image. selftest exits non-zero on a scoring mismatch, so this
      # also proves the embedded capture survived the build.
      - name: Entrypoint runs inside the image
        run: docker run --rm blockcast-shreds:ci selftest --fixture --json

      # Until this step existed the lane built and verified the image and then
      # threw it away (push: false, zero releases), so the binary BLO-22821
      # shipped was deployable nowhere. Push only after selftest has passed, and
      # only on a `push` event: a fork cannot raise one, so a pull_request run
      # never holds registry credentials.
      #
      # Off main this is a credential PROBE, not a publish, and it is
      # deliberately never red. No agent identity can read Actions secrets (the
      # App token 403s on /actions/secrets for every repo in the org), so
      # "does go-amt see HARBOR_*?" is otherwise unmeasurable until a merge
      # answers it — by turning main red for however long the grant takes. The
      # probe moves that answer onto the branch, before the merge, and keeps
      # answering it: a credential revoked later surfaces here instead of on
      # release day.
      - name: Publish the verified image
        if: github.event_name == 'push'
        env:
          REPO: registry.blockcast.net/blockcast/go-amt/blockcast-shreds
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          if [ -z "${HARBOR_USERNAME}" ] || [ -z "${HARBOR_PASSWORD}" ]; then
            msg="HARBOR_USERNAME/HARBOR_PASSWORD are not visible to this repository, so the verified image cannot be published. They are set for other Blockcast repos (pim-multicast-gateway, magma, frr); this repo needs the same grant. See BLO-40067."
            # Red on main, where it blocks a real publish. A warning elsewhere:
            # a missing org grant is not a defect in whatever branch is building.
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "::error::${msg}"
              exit 1
            fi
            echo "::warning::${msg}"
            exit 0
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::notice::Harbor credentials are visible to this repository." \
                 "Not pushing from ${GITHUB_REF} — publish is main-only."
            exit 0
          fi
          printf '%s' "${HARBOR_PASSWORD}" \
            | docker login registry.blockcast.net -u "${HARBOR_USERNAME}" --password-stdin
          docker tag blockcast-shreds:ci "${REPO}:main"
          docker tag blockcast-shreds:ci "${REPO}:sha-${GITHUB_SHA}"
          docker push "${REPO}:main"
          docker push "${REPO}:sha-${GITHUB_SHA}"

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean
      # Guards the deliverable itself: a dynamically linked release binary
      # would still build and still pass tests, and would fail on a customer
      # validator with a different libc.
      - name: Release binary is static
        run: |
          binary="$(find dist -type f -name blockcast-shreds | head -1)"
          test -n "$binary" || { echo "no release binary produced"; exit 1; }
          file "$binary"
          file "$binary" | grep -q "statically linked" \
            || { echo "release binary is not statically linked"; exit 1; }
