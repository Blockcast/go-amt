name: packaging

# The Dockerfile, goreleaser config and install smoke test cannot be validated
# by `go test`, so without this workflow they rot silently until a release fails.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  # The load-bearing job: builds the static binary exactly as shipped and runs
  # the same smoke test an operator runs after installing it.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the shipped static binary
        # The -X path is fully qualified because the Go linker discards an -X for
        # an unknown symbol silently: -X main.version would build clean and
        # report dev-unstamped forever. github.ref_name stands in for the
        # release tag so this lane exercises the same stamped shape a release
        # takes, rather than leaving the stamp untested until tag day.
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X github.com/blockcast/go-amt/broker.version=${GITHUB_REF_NAME}" \
            -o blockcast-shreds ./cmd/blockcast-shreds
      - name: Assert the version stamp resolved
        # Guards the silent-discard failure directly: if the symbol path above
        # ever drifts, the binary still builds and this is the only thing that
        # notices.
        run: |
          reported="$(./blockcast-shreds --version)"
          echo "reported version: ${reported}"
          if [ "${reported}" = "dev-unstamped" ]; then
            echo "::error::-X stamp was silently discarded: the binary still reports dev-unstamped." \
                 "Check the symbol path github.com/blockcast/go-amt/broker.version in this workflow," \
                 ".goreleaser.yaml and the Dockerfile."
            exit 1
          fi
      - name: Install smoke test
        run: packaging/smoke-test.sh ./blockcast-shreds

  docker:
    runs-on: ubuntu-latest
    # Serialise per ref so two quick merges cannot push `:main` out of order: a
    # slower build of the OLDER commit finishing last would leave the floating
    # tag on the older image, silently (`sha-*` tags are immutable and safe).
    # Never cancel-in-progress: killing an in-flight publish is worse than
    # waiting. GitHub still drops a superseded PENDING run, so with three quick
    # merges the middle commit gets no `sha-*` tag -- `:main` stays correct.
    # `on:` has no branch filter, hence the ref in the key.
    concurrency:
      group: packaging-docker-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # On a v* tag the image must report the release version rather than the
      # commit sha: an operator who pulled :v0.3.0 and runs --version needs back
      # the string the release is named by, and the broker's version census is
      # the field-rollback lever (W4 enforces a minimum supported version), so a
      # released image reporting sha-<40hex> is unrankable against a floor.
      # Everywhere else the sha is the only stable handle there is.
      - name: Resolve the version stamp
        id: stamp
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT" ;;
            *)            echo "version=sha-${GITHUB_SHA}"  >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: blockcast-shreds:ci
          # Without this the image reports dev-unstamped forever, which is the
          # right default for a hand build and useless for one a cluster pulls:
          # the sha is what lets an operator tie a running pod to a commit.
          build-args: VERSION=${{ steps.stamp.outputs.version }}
      # An image that builds but cannot execute its entrypoint is not a
      # verified image. selftest exits non-zero on a scoring mismatch, so this
      # also proves the embedded capture survived the build.
      - name: Entrypoint runs inside the image
        run: docker run --rm blockcast-shreds:ci selftest --fixture --json
      # The image twin of the host binary's stamp guard above. selftest proves
      # scoring, not provenance: drop `build-args` or let the -X symbol path
      # drift in the Dockerfile and the image still builds, selftests green and
      # publishes reporting dev-unstamped, so every heartbeat from it is
      # unattributable. Assert the exact stamp the build was given, before the
      # publish step, so a wrong or missing one never reaches the registry.
      - name: Version stamp survived the image build
        env:
          EXPECTED: ${{ steps.stamp.outputs.version }}
        run: |
          reported="$(docker run --rm blockcast-shreds:ci --version)"
          echo "reported version: ${reported}"
          if [ "${reported}" != "${EXPECTED}" ]; then
            echo "::error::the image reports '${reported}', expected '${EXPECTED}'." \
                 "Check build-args in this workflow and ARG VERSION / the -X symbol path in the Dockerfile."
            exit 1
          fi

      # Until this step existed the lane built and verified the image and then
      # threw it away (push: false, zero releases), so the binary BLO-22821
      # shipped was deployable nowhere. Push only after selftest has passed, and
      # only on a `push` event: a fork cannot raise one, so a pull_request run
      # never holds registry credentials.
      #
      # Off a publish ref (main, or a v* tag) this is a credential PROBE, not a
      # publish, and it is
      # deliberately never red. No agent identity can read Actions secrets (the
      # App token 403s on /actions/secrets for every repo in the org), so
      # "does go-amt see HARBOR_*?" is otherwise unmeasurable until a merge
      # answers it — by turning main red for however long the grant takes. The
      # probe moves that answer onto the branch, before the merge, and keeps
      # answering it: a credential revoked later surfaces here instead of on
      # release day.
      - name: Publish the verified image
        if: github.event_name == 'push'
        env:
          REPO: registry.blockcast.net/blockcast/go-amt/blockcast-shreds
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # Red on main and on a v* tag, where it blocks a real publish. A
          # warning elsewhere: a missing or broken org grant is not a defect in
          # whatever branch is building.
          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/v*) publishing=1 ;;
            *)                            publishing=0 ;;
          esac
          refuse() {
            if [ "${publishing}" = 1 ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }
          if [ -z "${HARBOR_USERNAME}" ] || [ -z "${HARBOR_PASSWORD}" ]; then
            refuse "HARBOR_USERNAME/HARBOR_PASSWORD are not visible to this repository, so the verified image cannot be published. They are set for other Blockcast repos (pim-multicast-gateway, magma, frr); this repo needs the same grant. See BLO-40067."
          fi
          # Log in BEFORE the ref check, so the off-main probe proves the
          # credential authenticates, not merely that a value is visible. Login
          # pushes nothing. It still does not prove PUSH rights on this new repo
          # path: Harbor grants no per-repository scope at login, so a narrowly
          # scoped robot account can authenticate here and still be refused at
          # the first `docker push` on main.
          if ! printf '%s' "${HARBOR_PASSWORD}" \
              | docker login registry.blockcast.net -u "${HARBOR_USERNAME}" --password-stdin; then
            refuse "HARBOR_USERNAME/HARBOR_PASSWORD are visible to this repository but do not authenticate to registry.blockcast.net. See BLO-40067."
          fi
          if [ "${publishing}" != 1 ]; then
            echo "::notice::Harbor credentials authenticate for this repository." \
                 "Not pushing from ${GITHUB_REF} — publish is main- and v*-tag-only."
            exit 0
          fi
          # sha-<40hex> on every publish, so a running container is always
          # traceable to a commit whatever else it is tagged. main and v* then
          # add their own floating/immutable handles on top.
          tags="sha-${GITHUB_SHA}"
          case "${GITHUB_REF}" in
            refs/heads/main) tags="${tags} main" ;;
            refs/tags/v*)
              tags="${tags} ${GITHUB_REF_NAME}"
              # :latest moves only for a release with no prerelease segment.
              # Otherwise a v0.0.0-rc1 rehearsal would silently become what
              # `docker pull blockcast-shreds` hands an operator.
              case "${GITHUB_REF_NAME}" in
                *-*) echo "::notice::${GITHUB_REF_NAME} is a prerelease — not moving :latest." ;;
                *)   tags="${tags} latest" ;;
              esac
              ;;
          esac
          for t in ${tags}; do
            docker tag blockcast-shreds:ci "${REPO}:${t}"
            docker push "${REPO}:${t}"
          done

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean
      # Guards the deliverable itself: a dynamically linked release binary
      # would still build and still pass tests, and would fail on a customer
      # validator with a different libc.
      - name: Release binary is static
        run: |
          binary="$(find dist -type f -name blockcast-shreds | head -1)"
          test -n "$binary" || { echo "no release binary produced"; exit 1; }
          file "$binary"
          file "$binary" | grep -q "statically linked" \
            || { echo "release binary is not statically linked"; exit 1; }
