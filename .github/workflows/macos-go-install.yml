# Proves the documented Mac install path by cross-compiling on ARC
# (BLO-45892 AC 5). The module is fetched from the proxy at the tag, so the
# result does not depend on the PR diff. Tag pushes check the tag just cut.
name: macos go install
on:
  pull_request:
    paths: [.github/workflows/macos-go-install.yml]
  push:
    tags: ['v*']
jobs:
  go-install:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: default
    timeout-minutes: 15
    env:
      # ponytail: PRs pin the current release; bump when a newer one ships.
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.3.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: false}
      - run: uname -sm
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go install "github.com/blockcast/go-amt/cmd/blockcast-shreds@${TAG}"
      - name: Assert the install target is a macOS binary
        run: |
          binary="$(go env GOPATH)/bin/darwin_arm64/blockcast-shreds"
          file "$binary"
          file "$binary" | grep -q 'Mach-O'
