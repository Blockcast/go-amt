# goreleaser configuration for the customer-facing receiver binary.
#
# Verify locally with `goreleaser check` and `goreleaser build --snapshot --clean`.
# CI runs both on every push (.github/workflows/packaging.yml), because this file
# cannot be validated by `go test` and would otherwise rot silently.
version: 2

project_name: blockcast-shreds

before:
  hooks:
    - go mod tidy

builds:
  - id: blockcast-shreds
    main: ./cmd/blockcast-shreds
    binary: blockcast-shreds
    env:
      # The deliverable is one static pure-Go binary. If cgo ever creeps back
      # in, the release build must fail rather than ship something dynamically
      # linked against the build host's libc.
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    flags:
      # -trimpath keeps build-host paths out of the binary, so two builds of the
      # same commit on different machines are byte-identical.
      - -trimpath
    # goreleaser's default ldflags inject -X main.version/-X main.commit.
    # Package main declares none of those symbols, and the Go linker discards an
    # -X for an unknown symbol *silently*. The stamp below therefore names the
    # fully-qualified package path of the variable that actually exists,
    # broker.version, and NOT main.version — the two differ by a silent no-op
    # rather than by an error, which is why the path is spelled out here rather
    # than shortened.
    #
    # The version string is the deployed binary's only field-rollback lever (W4
    # enforces a minimum supported version at the billing edge), and the
    # heartbeat producer reports it via broker.Version() on every beat
    # (broker/gwclient). An unstamped release advertises "dev-unstamped" on
    # every heartbeat and collapses the fleet into one indistinguishable bucket
    # for the report_schema census, so this is load-bearing rather than cosmetic.
    #
    # TestReleaseStampIsNotDevUnstamped in cmd/blockcast-shreds guards the
    # symbol path: it builds a release-shaped binary and fails if it still
    # reports dev-unstamped.
    ldflags:
      - -s -w
      - -X github.com/blockcast/go-amt/broker.version={{ .Version }}

archives:
  - id: blockcast-shreds
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - docs/operations/install.md
      - packaging/systemd/blockcast-shreds.service
      - packaging/smoke-test.sh

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
